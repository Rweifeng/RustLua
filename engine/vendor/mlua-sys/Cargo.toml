[package]
edition = "2021"
rust-version = "1.85"
name = "mlua-sys"
version = "0.10.0"
authors = ["Aleksandr Orlenko <zxteam@pm.me>"]
build = "build/main.rs"
links = "lua"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Low level (FFI) bindings to Lua 5.5/5.4/5.3/5.2/5.1 (including LuaJIT) and Luau
"""
documentation = "https://docs.rs/mlua-sys"
readme = "README.md"
categories = ["external-ffi-bindings"]
license = "MIT"
repository = "https://github.com/mlua-rs/mlua"
resolver = "2"

[package.metadata.docs.rs]
features = [
    "lua55",
    "vendored",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
external = []
lua51 = []
lua52 = []
lua53 = []
lua54 = []
lua55 = []
luajit = []
luajit52 = ["luajit"]
luau = ["luau0-src"]
luau-codegen = ["luau"]
luau-vector4 = ["luau"]
module = []
vendored = [
    "lua-src",
    "luajit-src",
]

[lib]
name = "mlua_sys"
path = "src/lib.rs"

[dependencies.libc]
version = "0.2"

# wasm32-unknown-unknown support: the minimal libc shim lives inside mlua-sys
# itself 鈥?the Rust half as `src/wasm_shim.rs`, the C half (setjmp/longjmp via
# wasm EH, stdio, abort/exit) compiled from `wasm-shim-c/` by the build script
# into `liblua_shim.a`. Keeping both halves in this crate sidesteps cargo's
# `links`-crate link semantics (see src/lib.rs).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
libm = "0.2"

[build-dependencies.cc]
version = "1.0"

[build-dependencies.cfg-if]
version = "1.0"

[build-dependencies.lua-src]
version = ">= 550.0.0, < 550.1.0"
optional = true

[build-dependencies.luajit-src]
version = ">= 210.6.0, < 210.7.0"
optional = true

[build-dependencies.luau0-src]
version = "0.18.0"
optional = true

[build-dependencies.pkg-config]
version = "0.3.17"

[lints.rust.unexpected_cfgs]
