[workspace]
resolver = "2"
members = [
    "crates/editor",
    "crates/engine_core",
    "crates/game_runner",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["p2 project"]
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
engine_core = { path = "crates/engine_core" }
eframe = "0.33"
bytemuck = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }