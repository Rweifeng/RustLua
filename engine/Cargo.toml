[workspace]
resolver = "2"
members = [
    "crates/assetc",
    "crates/editor",
    "crates/engine_core",
    "crates/engine_host",
    "crates/game_runner",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["p2 project"]
license = "MIT OR Apache-2.0"
repository = ""

# Release 体积优化：strip 符号、LTO、单 codegen 单元、优化尺寸。
# 不启用 panic=abort，保留崩溃日志/回溯能力。
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[workspace.dependencies]
engine_core = { path = "crates/engine_core" }
engine_host = { path = "crates/engine_host" }
eframe = { version = "0.33", features = ["wgpu"] }
gltf = { version = "1.4", features = ["import"] }
bytemuck = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }