[workspace]
resolver = "2"
members = [
    "crates/assetc",
    "crates/editor",
    "crates/engine",
    "crates/game",
    "crates/game_web",
    "crates/gpu-web-probe",
    "crates/rustlua-animation",
    "crates/rustlua-assets",
    "crates/rustlua-assets-import",
    "crates/rustlua-audio",
    "crates/rustlua-camera",
    "crates/rustlua-component-codec",
    "crates/rustlua-ecs",
    "crates/rustlua-editor-ai",
    "crates/rustlua-editor-api",
    "crates/rustlua-editor-core",
    "crates/rustlua-editor-ui-studio",
    "crates/rustlua-frame-abi",
    "crates/rustlua-gameplay",
    "crates/rustlua-gpu",
    "crates/rustlua-infra",
    "crates/rustlua-input",
    "crates/rustlua-lua-api",
    "crates/rustlua-math",
    "crates/rustlua-navigation",
    "crates/rustlua-net",
    "crates/rustlua-physics",
    "crates/rustlua-render",
    "crates/rustlua-scene",
    "crates/rustlua-scripting",
    "crates/rustlua-visual-script",
    "crates/rustlua-ui",
    "crates/rustlua-ui-host-evidence",
    "crates/rustlua-ui-host-harness",
    "crates/rustlua-ui-scene-export",
    "crates/rustlua-ui-spec",
]

[workspace.package]
edition = "2024"
version = "0.1.1"
authors = ["RustLua project"]
license = "MIT OR Apache-2.0"
repository = ""

# Release 体积优化：strip 符号、LTO、单 codegen 单元、优化尺寸。
# panic 保持 abort（wasm32-unknown-unknown 默认）：全局 -C panic=unwind 会让 wgpu 的
# wasm 后端编译失败（RefCell 不满足 RefUnwindSafe 的 catch_unwind 约束，实测 2026-09-29）；
# cargo profile 的 panic=unwind 对 wasm target 也不生效（被 cargo 静默回退 abort）。
# 代价：Rust panic 在浏览器里是裸 "Error: unreachable"（位置被吞），排查用 web-runtime.js
# 分步日志 + 发布产物 --enable-logging 抓 console 定位。
[profile.release]
opt-level = "s"
lto = false
codegen-units = 16
strip = true

[workspace.dependencies]
engine = { path = "crates/engine" }
rustlua-math = { path = "crates/rustlua-math" }
rustlua-navigation = { path = "crates/rustlua-navigation" }
rustlua-net = { path = "crates/rustlua-net" }
rustlua-ecs = { path = "crates/rustlua-ecs" }
rustlua-editor-ai = { path = "crates/rustlua-editor-ai" }
rustlua-editor-core = { path = "crates/rustlua-editor-core" }
rustlua-editor-ui-studio = { path = "crates/rustlua-editor-ui-studio" }
rustlua-scene = { path = "crates/rustlua-scene" }
rustlua-camera = { path = "crates/rustlua-camera" }
rustlua-animation = { path = "crates/rustlua-animation" }
rustlua-render = { path = "crates/rustlua-render" }
rustlua-gpu = { path = "crates/rustlua-gpu" }
rustlua-frame-abi = { path = "crates/rustlua-frame-abi" }
rustlua-ui = { path = "crates/rustlua-ui" }
rustlua-ui-spec = { path = "crates/rustlua-ui-spec" }
rustlua-ui-scene-export = { path = "crates/rustlua-ui-scene-export" }
rustlua-ui-host-evidence = { path = "crates/rustlua-ui-host-evidence" }
rustlua-physics = { path = "crates/rustlua-physics" }
rustlua-assets = { path = "crates/rustlua-assets" }
rustlua-assets-import = { path = "crates/rustlua-assets-import" }
rustlua-component-codec = { path = "crates/rustlua-component-codec" }
rustlua-audio = { path = "crates/rustlua-audio" }
rustlua-input = { path = "crates/rustlua-input" }
rustlua-lua-api = { path = "crates/rustlua-lua-api" }
rustlua-gameplay = { path = "crates/rustlua-gameplay" }
rustlua-scripting = { path = "crates/rustlua-scripting" }
rustlua-visual-script = { path = "crates/rustlua-visual-script" }
rustlua-infra = { path = "crates/rustlua-infra" }
# P2 follow-up：关闭 eframe 默认启用的 accesskit（会拉入 Linux-only 的
# accesskit_unix -> atspi -> zbus 5 链，RustSec 已把 zbus_names/zvariant/zvariant_derive
# 标为 unmaintained）。项目没有使用屏幕阅读器/accesskit API；如将来要恢复无障碍支持，
# 应整体升级到 zbus 6 的 accesskit 栈，而不是只把 default-features 打开。
eframe = { version = "0.33", default-features = false, features = ["wgpu", "glow", "default_fonts", "x11", "wayland"] }
# M27-00：多标签停靠布局。egui_dock 与 egui 小版本硬绑定（crates.io 实测：0.18.0↔0.33、0.19↔0.34、0.20↔0.35、0.21↔0.36；钉 =0.18.0），升级 eframe 必须同步。
# `serde` feature（阶段 2）：DockState 本身带 serde derive，布局树直接落 layout.json；
# 代价是同时打开 egui/serde。
egui_dock = { version = "=0.18.0", features = ["serde"] }
gltf = { version = "1.4", features = ["import", "KHR_materials_emissive_strength"] }
bytemuck = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
getrandom = { version = "0.2", features = ["js"] }
# 统一错误处理（优化项 3）：
# - thiserror：库层「类型化错误」，替代手写的 `impl Display` + `impl Error` 样板。
# - anyhow：宿主/应用层「错误聚合」，替代 `Result<T, String>` 这类丢失类型的错误通道。
# 两者都在 wasm32-unknown-unknown 上可用（anyhow 依赖 std，本工程 wasm 目标开启 std）。
thiserror = "2.0"
anyhow = "1.0"

# wasm32-unknown-unknown support for mlua: vendored forks with the wasm patch
# (libc shim + wasm-EH error handling). See docs/ wasm notes.
[patch.crates-io]
# P2 follow-up：paste 已被上游归档；依赖方（egui_dock/simba/metal）仍声明 `paste`。
# 这里用 pastey 0.2.3 的维护代码做**同名兼容包**（Cargo 无法把不同包名的 path patch
# 注入 `paste` 依赖），包名/版本保持 1.0.15 以满足它们的 `paste ^1.0` 约束。
# 这不是把漏洞藏起来：实际编译的是 pastey 代码；详情见 docs/69 §4.1.1。
paste = { path = "vendor/paste" }
mlua = { path = "vendor/mlua" }
mlua-sys = { path = "vendor/mlua-sys" }
lua-src = { path = "vendor/lua-src" }
# P2 fork 2026-09-30：wasm-bindgen 宏导出由 extern "C-unwind" 改为 extern "C"，
# 消除 rustc 为 C-unwind 导出生成的 EH landing pad（try_table）——它与 Lua 的 legacy
# EH 混合后令 V8 的 legacy catch 失效，宿主函数返回 Err 的 pcall 在 wasm 上崩溃。
# 本工程全部 wasm 目标 panic=abort，C-unwind 语义无实际作用，改后无行为损失。
wasm-bindgen-macro = { path = "vendor/wasm-bindgen-macro/macro" }
wasm-bindgen-macro-support = { path = "vendor/wasm-bindgen-macro/macro-support" }
