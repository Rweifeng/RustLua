[build]
target-dir = "target"
# 本机资源限制（2026-10-21 实测口径）：这台机器 12 逻辑核 / 15.8 GB 内存、工作区在 E: 盘
# （当时只剩 30 GB 空闲）。cargo 默认按核数开 12 个 rustc，再叠增量编译的后果是：
#
# - **内存**：12 个 rustc + 链接器峰值吃满 16 GB → 进交换，整机卡死；
# - **磁盘**：`target/debug/incremental` 实测长到 **89 GB / 23.6 万个文件**，每次 `cargo test`
#   还在往上叠，是"磁盘跑满"的主因。
#
# 这里只压并行度 + 关增量编译。**刻意不改** debuginfo 与 target-dir：那会让所有产物指纹失效、
# 触发一次全量重编（反而制造最大的一次资源尖峰）。
#
# 临时放开：`cargo --jobs 4 …`；恢复默认：删掉这两行。
jobs = 4
incremental = false

[term]
verbose = false

# RustLua engine — wasm32-unknown-unknown support for the vendored mlua fork.
#
# - exception-handling: Lua's error handling relies on setjmp/longjmp, which on
#   bare WebAssembly is provided by the wasm exception-handling proposal. The
#   Rust side must enable the same target feature.
# - reference-types: wasm-bindgen 生成 catch wrappers 需要 externref table，
#   而该 table 只在模块声明 `reference-types` target feature 时才会被
#   wasm-bindgen-cli 处理（源码 lib.rs: 模块 target_features 检测），否则
#   打包报 "externref table required for catch wrappers"。
#
# 这里**不再**声明 `[env] ZIG`：那是单机绝对路径（历史上写死了某台机器的
# `C:\Users\Administrator\...`，换机器就 panic "run zig cc: NotFound"，且被打包脚本的
# `| Out-Null` 吞成"WASM build failed"）。zig 改由 `scripts/build/zig-toolchain.ps1` 解析并
# 按需下载到 `engine\.tools\zig\`（gitignore），由 package.ps1 在 wasm 构建前写进
# `$env:ZIG`。手工跑 `cargo build --target wasm32-unknown-unknown` 的人需自备 zig：
# 放进 PATH，或 `$env:ZIG = "<path-to-zig.exe>"`（mlua-sys 的 find_zig 认这两个）。

[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+exception-handling,+reference-types"]
