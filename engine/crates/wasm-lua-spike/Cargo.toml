[package]
name = "wasm-lua-spike"
version = "0.1.0"
edition = "2021"
authors = ["RustLua project"]
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mlua = { version = "0.11", features = ["lua54", "vendored"] }
# [DIAG] 二分实验：仅 wasm-bindgen rt 链接是否破坏 Lua EH（验证后移除）
wasm-bindgen = "0.2.129"
