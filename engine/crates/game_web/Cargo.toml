[package]
name = "game_web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# WebGL2 的 GPU 渲染路径（`gpu_host`）：把引擎渲染器接到画布上。
#
# **当前默认关，但这是一个已知缺口**：打开会把 wgpu 的 GL 后端编进发布产物
# （`engine/Cargo.toml` 的 webgl 段记着 ≈+139 KB 起）。显式打开：`scripts/package.ps1 -Gpu2d`。
#
# **为什么默认关现在是缺口（2026-10-15 记录，附撤回原因）**：两个平台的**运行期**默认都已经
# 翻到 Rust 宿主——浏览器 `plugins/webgl/index.html:149` 写着"Rust 侧默认开、`?rustlua-gpu=0` 关"，
# 微信 `wechat-adapter.js` 的原子模式也是默认开。于是"默认产物不带宿主"不再是省体积：浏览器会退回
# 旧 JS 世界（`index.html:177` 的 `fallbackToLegacyWorld`），微信直接 `engine_host=unavailable`
# `reason=kernel-without-gpu2d`（按已裁定的"默认开、不回退"，那是黑屏）。**所以这一行该转成
# `default = ["gpu2d"]`——但不能只改这一行。** 实测：转默认之后整条链走默认档，浏览器产物确实
# 变成 Rust 宿主出帧（`legacy JS world skipped`、`frame owner ok: engine GPU host`、
# `webgl_bundle_ok wasm=5292.2KB`，该门 exit 0），但 `scripts/verify.ps1:842-852` 的 Web 段硬要求
# `drawnSamples > 0` 与 `sceneVerify == "done"`，而这两个读数**只有旧 JS 世界会写**
# （`web-runtime.js`）⇒ 默认档跳过旧世界之后它们必然缺席（实测 bundle-summary 里
# `drawnSamples` 为空、`sceneVerify=absent`）⇒ `verify.ps1 -Web`（CI 在跑，见
# `.github/workflows/quality.yml:196`）会判红。**必须先改门**：让 `verify-webgl-bundle.ps1` 把引擎侧
# 证据（`data-rustlua-gpu`）落进 bundle-summary，再由 `verify.ps1` 用它替代那两条断言
# （即 `tasks/plan/M73-01-删除旧JS世界-删除面清单.md` 的 N1/N3），**然后**才轮到这一行。
# 顺序反了就得到"默认能用但 CI 红"——本轮就是照这个顺序踩了一次，已撤回。
[features]
default = ["gpu2d"]
gpu2d = ["dep:wgpu", "wgpu/webgl"]

[dependencies]
anyhow.workspace = true
engine = { path = "../engine" }
# 每帧输入线格式（`RLFI` 批量 ABI）：布局与键表只有这一份，JS 侧经
# `input_frame_layout_json()` 取，避免两处各写一份偏移。
rustlua-frame-abi.workspace = true
# GPU 宿主解预加载资源里的贴图：`start()` 存的是**打包原始字节**，
# 必须走与引擎同一套 `pack::decode`（见 `lua_bridge::first_png_resource`）。
rustlua-infra.workspace = true


rustlua-audio = { path = "../rustlua-audio" }
rustlua-camera = { path = "../rustlua-camera" }
rustlua-gameplay = { path = "../rustlua-gameplay" }
rustlua-input = { path = "../rustlua-input" }
rustlua-math = { path = "../rustlua-math" }
rustlua-scene = { path = "../rustlua-scene" }
rustlua-scripting = { path = "../rustlua-scripting" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
# GPU 渲染器句柄。`optional` + `gpu2d` 特性：默认不进产物。
wgpu = { version = "27", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    # 平台音频出口：浏览器侧用 `document.createElement('audio')` 播放。
    "HtmlAudioElement",
    # GPU 路径要自己造一张画布并贴样式（`gpu_host::create_gpu_canvas`）：
    # 一张 canvas 只能有一个上下文，2D 运行时已经拿走了游戏画布。
    "HtmlElement",
    "Node",
    "Location",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "WebGl2RenderingContext",
    "Window",
    # 平台存档槽：`localStorage`（微信侧由 wechat-adapter 映射到 wx 存储）。
    "Storage",
    "console",
] }
# wasm Lua 桥（lua_bridge.rs）直接使用 mlua 类型：必须与 engine 同一 feature 集，
# 否则 workspace 会编译两份 mlua 实例、Value/Function 类型无法互通。
mlua = { version = "0.11", features = ["lua54", "vendored"] }
# wasm 侧的 `tracing` 出口（`wasm_log`）：引擎的字体/资源/渲染诊断全走 `tracing`，
# 宿主此前没装订阅者，那些行在浏览器里被静默丢掉——上一轮排查字体时只能靠 DOM 属性反推。
tracing.workspace = true
# 宿主自己的计时（启动耗时、首步耗时）：wasm 上 `std::time::Instant::now()` 是 panic 路径。
web-time = "1"
