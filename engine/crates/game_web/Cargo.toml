[package]
name = "game_web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
engine = { path = "../engine" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "WebGl2RenderingContext",
    "Window",
    "console",
] }
# wasm Lua 桥（lua_bridge.rs）直接使用 mlua 类型：必须与 engine 同一 feature 集，
# 否则 workspace 会编译两份 mlua 实例、Value/Function 类型无法互通。
mlua = { version = "0.11", features = ["lua54", "vendored"] }
# wasm Lua 桥的 JSON 参数/返回值编解码（lua_bridge.rs）。
serde_json = "1"
