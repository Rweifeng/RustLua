[package]
name = "game_web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# WebGL2 的 GPU 渲染路径（`gpu_host`）：把引擎渲染器接到画布上。
#
# **现状：默认开**（就是下面那行 `default = ["gpu2d"]`）。两个平台的运行期默认都已翻到 Rust
# 宿主（浏览器 `plugins/webgl/index.html` 的"引擎宿主独占这一帧"、微信 `wechat-adapter.js` 的
# 原子模式恒开），而 B8 又把可回退的旧 JS 世界删掉了 —— 产物不带宿主就**没有任何绘制者**
# ⇒ 默认关不再是"省体积"，而是黑屏（`engine_host=unavailable` / `reason=kernel-without-gpu2d`）。
# `scripts/build/package.ps1 -Gpu2d` 因此退化成幂等的显式写法（既有命令继续可用）。
#
# **2026-10-15 那次翻转为什么被撤回（顺序错，不是结论错）**：那时先翻了这一行，而
# `scripts/verify/verify.ps1` 的 Web 段还硬要求 `drawnSamples > 0` 与 `sceneVerify == "done"` ——
# 这两个读数**只有被删的旧 JS 世界会写**（`web-runtime.js`）⇒ 默认档跳过旧世界之后它们必然
# 缺席（实测 bundle-summary 里 `drawnSamples` 为空、`sceneVerify=absent`），CI
# （`.github/workflows/quality.yml`）于是判红。前提（门先改：`verify-webgl-bundle.ps1` 把引擎侧
# 证据 `data-rustlua-gpu` 落进 bundle-summary，`verify.ps1` 改用 `jsHostSkipped + gpuState=presented*`
# 判非黑屏）今天已经满足，所以这行保持默认开。
[features]
default = ["gpu2d"]
gpu2d = ["dep:wgpu", "wgpu/webgl"]

[dependencies]
anyhow.workspace = true
engine = { path = "../engine" }
# 每帧输入线格式（`RLFI` 批量 ABI）：布局与键表只有这一份，JS 侧经
# `input_frame_layout_json()` 取，避免两处各写一份偏移。
rustlua-frame-abi.workspace = true
# GPU 宿主解预加载资源里的贴图：`start()` 存的是**打包原始字节**，
# 必须走与引擎同一套 `pack::decode`（见 `lua_bridge::first_png_resource`）。
rustlua-infra.workspace = true


rustlua-audio = { path = "../rustlua-audio" }
rustlua-camera = { path = "../rustlua-camera" }
rustlua-gameplay = { path = "../rustlua-gameplay" }
rustlua-input = { path = "../rustlua-input" }
rustlua-math = { path = "../rustlua-math" }
rustlua-scene = { path = "../rustlua-scene" }
rustlua-scripting = { path = "../rustlua-scripting" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
# GPU 渲染器句柄。`optional` + `gpu2d` 特性：默认不进产物。
# **`default-features = false` 是体积优化的一半**（2026-10-17）：本产物只跑 WebGL2，
# wgpu 的默认特性（dx12/metal/vulkan/gles/webgpu + naga 的 `wgsl-out`）在浏览器里全是死重。
# 只留 `std` + `wgsl`（运行期 WGSL 要 naga `wgsl-in`），后端由 `gpu2d` 里的 `wgpu/webgl` 开。
# engine 那边同步做了同样的事（`crates/engine/Cargo.toml` 的 wasm 段）——**两边任一漏掉，
# 特性合并就会把默认特性又拉回来，体积读数一动不动**（这条实测踩过）。
wgpu = { version = "27", optional = true, default-features = false, features = ["std", "wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# 资源预载的**限并发**调度（`FuturesUnordered`）：1,300+ 个小文件的 `fetch` 串行等待是纯自排队，
# 浏览器侧本来就是并发的。只取 `std` 档，不拉 `async-std`/`tokio` 那类执行器（wasm 上不需要，
# promise 的推进由 JS 微任务队列负责）。
futures-util = { version = "0.3", default-features = false, features = ["std"] }
web-sys = { version = "0.3", features = [
    # 容器形态的音频走 Blob URL（docs/67 批 C2）：需要 Blob / BlobPropertyBag / Url。
    "Blob",
    "BlobPropertyBag",
    "Url",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    # 平台音频出口：浏览器侧用 `document.createElement('audio')` 播放。
    "HtmlAudioElement",
    # GPU 路径要自己造一张画布并贴样式（`gpu_host::create_gpu_canvas`）：
    # 一张 canvas 只能有一个上下文，2D 运行时已经拿走了游戏画布。
    "HtmlElement",
    "Node",
    "Location",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "WebGl2RenderingContext",
    "Window",
    # 平台存档槽：`localStorage`（微信侧由 wechat-adapter 映射到 wx 存储）。
    "Storage",
    "console",
] }
# wasm Lua 桥（lua_bridge.rs）直接使用 mlua 类型：必须与 engine 同一 feature 集，
# 否则 workspace 会编译两份 mlua 实例、Value/Function 类型无法互通。
mlua = { version = "0.11", features = ["lua54", "vendored"] }
# wasm 侧的 `tracing` 出口（`wasm_log`）：引擎的字体/资源/渲染诊断全走 `tracing`，
# 宿主此前没装订阅者，那些行在浏览器里被静默丢掉——上一轮排查字体时只能靠 DOM 属性反推。
tracing.workspace = true
# 宿主自己的计时（启动耗时、首步耗时）：wasm 上 `std::time::Instant::now()` 是 panic 路径。
web-time = "1"
