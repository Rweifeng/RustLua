[package]
name = "game"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
engine.workspace = true
winit = "0.30"
tracing.workspace = true
# 下列依赖仅被 examples/（独立 GPU demo）使用，主二进制通过 engine 间接使用。
bytemuck.workspace = true
pollster = "0.4"
wgpu = "27"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

rustlua-assets = { path = "../rustlua-assets" }
rustlua-camera = { path = "../rustlua-camera" }
rustlua-ecs = { path = "../rustlua-ecs" }
rustlua-gameplay = { path = "../rustlua-gameplay" }
rustlua-infra = { path = "../rustlua-infra" }
rustlua-input = { path = "../rustlua-input" }
rustlua-math = { path = "../rustlua-math" }
rustlua-render = { path = "../rustlua-render" }
rustlua-scene = { path = "../rustlua-scene" }
rustlua-scripting = { path = "../rustlua-scripting" }
rustlua-ui = { path = "../rustlua-ui" }
