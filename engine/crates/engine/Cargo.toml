[package]
name = "engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
# P3-E06-4：采集包/差分是有版本的持久化格式，用 derive 固定字段名；
# serde/serde_json 已在锁文件里（编辑器与示例早就在用），不新增下载。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
# WP5：`wasm32-unknown-unknown` 的 std 落在 `sys/pal/unsupported`，`Instant::now()` 会 panic
# （"time not implemented on this platform"）；渲染器在 wasm 上跑起来后帧计时就会踩到它。
# `web-time` 在原生上**就是** `std::time::Instant` 的再导出（同类型、零行为变化），
# 在 wasm 上换成 `performance.now()`。它已经在 Cargo.lock 里（winit 的 wasm 依赖拉的），
# 所以这里加它不引入任何新的下载/版本。
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
getrandom.workspace = true

# Engine core implementation crates.
rustlua-math.workspace = true
rustlua-ecs.workspace = true
rustlua-scene.workspace = true
rustlua-component-codec.workspace = true
rustlua-camera.workspace = true
rustlua-animation.workspace = true
rustlua-render.workspace = true
rustlua-ui.workspace = true
rustlua-physics.workspace = true
rustlua-assets.workspace = true
rustlua-audio.workspace = true
# `audio` 绑定的能力单元类型（`Handle<AudioSystem>`）：组合根持有它驱动 BGM 生命周期。
rustlua-lua-api.workspace = true
rustlua-input.workspace = true
rustlua-gameplay.workspace = true
rustlua-scripting.workspace = true
rustlua-infra.workspace = true

[dev-dependencies]
# 只在例子/测试里用：`subset_project_font` 要扫工程字符集（`char_collect` 住在导入层，
# 运行时不许依赖它——那会把 PNG/音频编解码拖回浏览器产物，见 `docs/62` P1 ③）。
rustlua-assets-import = { path = "../rustlua-assets-import" }
# `examples/royale_verify.rs`：两个裸 Lua VM 各跑 battle.lua，经真实 TCP 做帧同步对拍。
rustlua-net = { path = "../rustlua-net" }
mlua = { version = "0.11", features = ["lua54", "vendored"] }
rustlua-gpu.workspace = true
# M77-01：渲染器实现搬进 `rustlua-gpu` 后，engine 的 normal 依赖里没有 wgpu（这是本包的
# 验收门：`cargo tree -p engine -e normal` 对 wgpu 零命中）。
# M77-02 offscreen 合并（已执行）：22 个自建 adapter 的 `examples/wp0_*.rs` **全部**改走
# `rustlua_gpu` 的 fixture——20 个用 `OffscreenTarget::acquire`（要自己那张目标纹理），2 个用
# `OffscreenDevice::acquire`（只要设备，画面缓冲由 `Renderer::new_offscreen(.., None, ..)` 造）。
# 复现：`grep -l OffscreenTarget::acquire examples/wp0_*.rs | wc -l` = 20、
# `grep -l OffscreenDevice::acquire examples/wp0_*.rs | wc -l` = 2、
# `grep -l request_adapter examples/*.rs` 只剩 `scene_shot.rs`（未入库，属 game_api 2.0 那路）。
# wgpu/pollster/bytemuck 这三条 dev 依赖**摘不掉**，与合并前预计的「能摘」不同，按实测的残余写在这里：
# - wgpu：22 个例子里 9 个整份文件已不再摸 wgpu（`grep -l Offscreen.*acquire *.rs | xargs grep -L 'wgpu::' | wc -l`），
#   其余 13 个里 11 个只剩辅助函数形参 `texture: &wgpu::Texture` / `view: &wgpu::TextureView`
#   （把形参换成 `&OffscreenTarget` 能清掉，但那是 9 条 release 像素 golden 加 3d_stress /
#   shader_hot_reload 的改动面，换不到任何依赖摘除，本批不动）；真用法两条：`wp0_compute_readback` 的 STORAGE buffer 与
#   `wgpu::util::DeviceExt` 就是那条门的被测对象，`wp0_gpu_particles_50k` 要 `device.poll(PollType::Wait)`。
# - pollster：本仓库的例子已全都不再用它，唯一使用者是在途未入库的 `scene_shot.rs`——不替别人决定形状。
# - bytemuck：只剩 `wp0_compute_readback` 用它把 readback 字节切成 `&[f32]`。
# dev 依赖不进下游 crate 的编译面，留原位不影响任何门读数。
bytemuck.workspace = true
pollster = "0.4"
wgpu = "27"

# M20-06：桌面手柄设备轮询。原计划的 gilrs 在本机离线环境下无法解析
# （crates 已缓存但索引不可用，见任务文档），改用已在依赖树中的 windows-sys
# XInput（Windows 原生），保持 GamepadBackend 抽象以便后续替换为 gilrs。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_XboxController"] }

# 文件日志（tracing-appender）在 wasm32-unknown-unknown 上不可用（无 symlink/
# 文件系统），wasm 构建只保留 console/sink 层。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-appender.workspace = true
