[package]
name = "engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
bytemuck.workspace = true
mlua = { version = "0.11", features = ["lua54", "vendored"] }
serde_json = "1"
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
image = { version = '0.25', default-features = false, features = ['png', 'jpeg'] }
rapier2d = "0.22"
rapier3d = "0.22"
crossbeam-channel = "0.5"
rodio = "0.19"
ab_glyph = "0.2"
bymsdfgen-core = "0.1"
ttf-parser = "0.25"
gltf.workspace = true
flate2 = "1"
chacha20poly1305 = "0.10"
rand = "0.8"
getrandom.workspace = true
pollster = "0.4"
wgpu = "27"
winit = "0.30"

[dev-dependencies]
vorbis = "0.1"

# M20-06：桌面手柄设备轮询。原计划的 gilrs 依赖在本机离线环境下无法解析
# （crates 已缓存但索引不可用，见任务文档），改用已在依赖树中的 windows-sys
# XInput（Windows 原生），保持 GamepadBackend 抽象以便后续替换为 gilrs。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_XboxController"] }
