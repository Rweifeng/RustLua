[package]
name = "rustlua-render"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
bymsdfgen-core = "0.1"
ttf-parser = "0.25"
bytemuck.workspace = true
rustlua-math = { path = "../rustlua-math" }
rustlua-component-codec = { path = "../rustlua-component-codec" }
rustlua-ecs = { path = "../rustlua-ecs" }
rustlua-camera = { path = "../rustlua-camera" }
rustlua-infra = { path = "../rustlua-infra" }
rustlua-assets = { path = "../rustlua-assets" }
# `renderable_lua`：可渲染组件的 Lua 面跟着组件类型住（P1 ⑤-10）。`lua-api` 是叶子契约层
# （`Handle` / `api_error` / `ProjectRoot`），`animation` 只为读 `AnimationStateMachine` 的当前 clip。
rustlua-lua-api = { path = "../rustlua-lua-api" }
rustlua-animation = { path = "../rustlua-animation" }
mlua = { version = "0.11", features = ["lua54", "vendored"] }
