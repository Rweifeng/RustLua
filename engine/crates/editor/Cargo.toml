[package]
name = "editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
engine.workspace = true
thiserror.workspace = true
eframe.workspace = true
wgpu = "27"
serde_json = "1"
tracing.workspace = true
[target."cfg(windows)".dependencies]
# `Win32_System_ProcessStatus` + `Win32_System_Threading`：docs/55 阶段 0 的长会话
# soak 报告要给出**真实进程工作集**，否则"8 小时无持续内存增长"只能靠感觉判断。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
pollster = "0.4"
