[package]
name = "editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
# M75：AI 能力层（MCP server + 确认网关）只在**原生编辑器**构建里存在。
# 关闭后 editor 的依赖图里没有 `rustlua-editor-ai`（`--no-default-features` 可量体积差）。
default = ["ai-bridge"]
ai-bridge = ["dep:rustlua-editor-ai"]

[dependencies]
engine.workspace = true
anyhow.workspace = true
thiserror.workspace = true
eframe.workspace = true
egui_dock.workspace = true
wgpu = "27"
# 阶段 2：`DockTab` 需要 serde derive 才能让 egui_dock 的 `DockState` 序列化落地。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing.workspace = true

rustlua-animation = { path = "../rustlua-animation" }
rustlua-assets = { path = "../rustlua-assets" }
rustlua-assets-import = { path = "../rustlua-assets-import" }
rustlua-audio = { path = "../rustlua-audio" }
rustlua-camera = { path = "../rustlua-camera" }
rustlua-ecs = { path = "../rustlua-ecs" }
rustlua-editor-ai = { workspace = true, optional = true }
rustlua-gameplay = { path = "../rustlua-gameplay" }
rustlua-gpu.workspace = true
# `bundle-write`：分包面板要在编辑器里**按发布同款编码器**预估每组的落盘字节
# （zstd 是构建期依赖，编辑器是原生程序，不进 wasm）。
rustlua-infra = { path = "../rustlua-infra", features = ["bundle-write"] }
rustlua-editor-api = { path = "../rustlua-editor-api" }
rustlua-input = { path = "../rustlua-input" }
rustlua-math = { path = "../rustlua-math" }
rustlua-physics = { path = "../rustlua-physics" }
rustlua-render = { path = "../rustlua-render" }
rustlua-scene = { path = "../rustlua-scene" }
rustlua-scripting = { path = "../rustlua-scripting" }
rustlua-ui = { path = "../rustlua-ui" }
# M76-03：`.ui.json` 文档宿主（编译/校验/预览/提案）复用契约层，不再另写一份。
rustlua-ui-spec = { path = "../rustlua-ui-spec" }
# P3-E03-2：画布编辑器的图模型/校验/代码生成（叶子 crate，不依赖引擎）。
rustlua-visual-script = { path = "../rustlua-visual-script" }
[target."cfg(windows)".dependencies]
# `Win32_System_ProcessStatus` + `Win32_System_Threading`：docs/55 阶段 0 的长会话
# soak 报告要给出**真实进程工作集**，否则"8 小时无持续内存增长"只能靠感觉判断。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
pollster = "0.4"
