[package]
name = "rustlua-ecs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
# 时钟：wasm 上 std 的 Instant::now() 是 panic 路径；web-time 在 wasm 走 performance.now()、原生就是 std。
web-time = "1"
thiserror.workspace = true
serde_json = "1"
rustlua-math = { path = "../rustlua-math" }
rustlua-infra = { path = "../rustlua-infra" }
# transform_lua（以及后续的 entity_lua / tilemap_lua）：组件与世界的 Lua 面跟着类型住
# （P1 ⑤-10）。`lua-api` 是叶子契约层（`Handle` / `api_error`）。
rustlua-lua-api = { path = "../rustlua-lua-api" }
mlua = { version = "0.11", features = ["lua54", "vendored"] }

[dev-dependencies]
rustlua-animation = { path = "../rustlua-animation" }
rustlua-scene = { path = "../rustlua-scene" }
rustlua-ui = { path = "../rustlua-ui" }
rustlua-physics = { path = "../rustlua-physics" }
rustlua-render = { path = "../rustlua-render" }
rustlua-camera = { path = "../rustlua-camera" }
