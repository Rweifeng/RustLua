[package]
name = "rustlua-gameplay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
rustlua-ecs = { path = "../rustlua-ecs" }
rustlua-audio = { path = "../rustlua-audio" }
rustlua-input = { path = "../rustlua-input" }
# `audio_lua`：audio 绑定的组合根接线（端口实现 + 注册表）。
# 设置文件走 vfs 读（wasm 无文件系统），所以需要 infra。
rustlua-infra = { path = "../rustlua-infra" }
rustlua-lua-api = { path = "../rustlua-lua-api" }
# `nav_lua`：导航网格的 Lua 表。计算本身是纯几何 crate，绑定只做状态登记与坐标转换。
rustlua-navigation = { path = "../rustlua-navigation" }
# save_lua：存档绑定下沉到存档域（P1 ⑤-2）。mlua 只用于装 save 全局表。
mlua = { version = "0.11", features = ["lua54", "vendored"] }
serde_json = "1"
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# net_lua：浏览器侧只有 WebSocket 这一条路（桌面侧是 std::net，不需要额外依赖）。
# 功能清单按最小面取：socket 回调 + 二进制载荷 + 用 location/query 推默认地址。
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "Event",
    "Location",
    "MessageEvent",
    "UrlSearchParams",
    "WebSocket",
    "Window",
] }
