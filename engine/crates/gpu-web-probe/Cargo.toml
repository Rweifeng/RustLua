[package]
name = "gpu-web-probe"
version = "0.1.0"
edition = "2021"
authors = ["RustLua project"]
license = "MIT OR Apache-2.0"
publish = false

[lib]
# 只做 spike：产物是给浏览器直接 import 的 wasm 模块，不需要被任何 crate 链接进来。
crate-type = ["cdylib"]

[dependencies]
# 探针是"浏览器里的一段异步问答"，所以它需要 wasm 侧的 Future 执行器（wasm-bindgen-futures）
# 和 DOM 句柄（web-sys）；这两者在产品代码里由宿主提供，这里必须自带。
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
    # `window.navigator()` 的返回类型。本 crate 直接调它（`lib.rs` 的 `run_probe`），
    # 必须自己声明：以前能编过是靠同一次构建里 engine 的 web 依赖把这项特性**合并**进来，
    # 单独 `-p gpu-web-probe` 且依赖图里没有别人开 Navigator 时就红。
    "Navigator",
    "console",
] }
# `features = ["webgl"]`：**必须显式打开**。wgpu 的 default 在 wasm32 上只含 `webgpu`，
# 而本探针的核心问题恰恰是"只有 WebGL2 的浏览器上会发生什么"，不打开这个特性就完全测不到
# GL 后端（`Backends::GL` 会退化成空后端集）。
wgpu = { version = "27", features = ["webgl"] }
# 探针结论要能被宿主当数据读，所以结果统一序列化成 JSON 字符串。
serde_json = "1"
# 探针直接驱动真实 GPU 渲染器，不为渲染实现拖入运行时组合根。
rustlua-gpu = { path = "../rustlua-gpu", features = ["webgl"] }
rustlua-render = { path = "../rustlua-render" }
rustlua-camera = { path = "../rustlua-camera" }
rustlua-math = { path = "../rustlua-math" }
