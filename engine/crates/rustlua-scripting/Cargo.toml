[package]
name = "rustlua-scripting"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
# M81：2D 基底 + 3D 可插包。`3d` 默认开；2D 发布 = --no-default-features。
# 透传到组合根（nav 登记在 gameplay 的 registry() 里）。
default = ["3d"]
3d = ["rustlua-gameplay/3d"]

[dependencies]
thiserror.workspace = true
serde_json = "1"
tracing.workspace = true
mlua = { version = "0.11", features = ["lua54", "vendored"] }
anyhow.workspace = true
rustlua-math = { path = "../rustlua-math" }
rustlua-ecs = { path = "../rustlua-ecs" }
rustlua-scene = { path = "../rustlua-scene" }
rustlua-render = { path = "../rustlua-render" }
# 时钟：wasm32-unknown-unknown 上 `std::time::Instant::now()` 是 panic 路径（与 ecs/infra、gamepad
# 同一颗雷）；`web-time` 在原生上就是它的再导出，零行为变化。
# 用途：`ui.measure_text` 首次调用要读 + 解析工程字体，那一段耗时必须能量出来。
web-time = "1"
# Lua 绑定的契约层（`docs/62` P1）：绑定期的错误口径 + 能力句柄 + 安装器注册表。
# 它是叶子 crate（只依赖 mlua），所以"绑定下沉到所属 crate"不会成环。
rustlua-lua-api = { path = "../rustlua-lua-api" }
# M81：feature 链上的边必须显式断默认，否则 feature 统一会把 gameplay/3d 悄悄开回来。
rustlua-gameplay = { path = "../rustlua-gameplay", default-features = false }
rustlua-infra = { path = "../rustlua-infra" }
# P3-E03-3：运行时把 `.vgraph` 编译成同一套 Lua，不引入第二套 VM。
rustlua-visual-script = { path = "../rustlua-visual-script" }

[dev-dependencies]
# 相机绑定与组件装配已由组合根接管（`engine::host::script_packs`）：库本身不再依赖相机域，
# 但测试要造相机组件、要按相机状态断言宿主回填的投影，所以它留在这里——dev 依赖不参与
# 产物的依赖图（`architecture_edges` 的门也只扫库依赖）。
rustlua-camera = { path = "../rustlua-camera" }
# 动画的组件类型与帧事件类型同样是测试要造/要断言的领域知识（绑定与装配已归组合根）。
rustlua-animation = { path = "../rustlua-animation" }
# 物理组件类型与碰撞形状同样是测试要造/要断言的领域知识（绑定、装配与驱动已归组合根）。
rustlua-physics = { path = "../rustlua-physics" }
# M84：`spine` 表由组合根装（`engine::host::script_packs`），库本身对 Spine 零引用。
# 但快照门（`api_surface_snapshot`）用的是本 crate 自建的测试运行时，必须也装这张表，
# 否则基线与实际 API 面会差一整块。dev 依赖不进产物依赖图，也不进 `architecture_edges`。
rustlua-spine = { path = "../rustlua-spine" }
# UI 绑定、15 类场景组件装配、宿主访问器与 prefab 布局节点计算已由组合根接管
# （`engine::host::script_packs` / `runtime_scene::ui_driver` / `mesh_ui`）：库本身对 UI 域
# 零引用（`docs/62` P1 阶段 4d）。测试仍要造 UI 组件与 UiState 句柄、断言脚本写入的
# 文本/条，所以它留在这里——dev 依赖不参与产物的依赖图（`architecture_edges` 只扫库依赖）。
rustlua-ui = { path = "../rustlua-ui" }
# input 绑定下沉后库里不再依赖它（docs/62 P1 阶段 3）；测试仍要造快照。
rustlua-input = { path = "../rustlua-input" }
# 测试要真落盘 PNG：加载器只读图片头取尺寸，非图片字节过不了这一步。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# `audio` 绑定已下沉到 `rustlua-audio`（`docs/62` P1）。测试仍要读音频设置版本号，
# 但这只是 **dev** 依赖：库本身不再依赖它，改动半径与产物的依赖图都不受影响。
rustlua-audio = { path = "../rustlua-audio" }
