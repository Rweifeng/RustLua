[package]
name = "rustlua-scripting"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
serde_json = "1"
tracing.workspace = true
mlua = { version = "0.11", features = ["lua54", "vendored"] }
anyhow.workspace = true
rustlua-math = { path = "../rustlua-math" }
rustlua-ecs = { path = "../rustlua-ecs" }
rustlua-scene = { path = "../rustlua-scene" }
rustlua-camera = { path = "../rustlua-camera" }
rustlua-animation = { path = "../rustlua-animation" }
rustlua-render = { path = "../rustlua-render" }
rustlua-physics = { path = "../rustlua-physics" }
rustlua-ui = { path = "../rustlua-ui" }
# 时钟：wasm32-unknown-unknown 上 `std::time::Instant::now()` 是 panic 路径（与 ecs/infra、gamepad
# 同一颗雷）；`web-time` 在原生上就是它的再导出，零行为变化。
# 用途：`ui.measure_text` 首次调用要读 + 解析工程字体，那一段耗时必须能量出来。
web-time = "1"
rustlua-assets = { path = "../rustlua-assets" }
rustlua-audio = { path = "../rustlua-audio" }
rustlua-input = { path = "../rustlua-input" }
rustlua-gameplay = { path = "../rustlua-gameplay" }
rustlua-infra = { path = "../rustlua-infra" }

[dev-dependencies]
# 图集引用门要真实落盘 PNG：加载器只读图片头取尺寸，非图片字节过不了这一步。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
