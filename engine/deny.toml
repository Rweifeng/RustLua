# cargo-deny 配置（P2-01 ③）
#
# 运行位置：`engine/`（`scripts/verify/check-security.ps1` 会 cd 到 engine 后执行
# `cargo-deny check`）。覆盖四类：advisories / licenses / bans / sources。
#
# 原则：
#   - 漏洞与 yanked 包默认判红；例外必须写进 docs/69 §4 的例外表（含到期日）。
#   - 许可证用 allow-list；新增依赖引入新许可证时门会红，这是有意的。
#   - 来源只允许 crates.io 与 path 依赖；git 依赖当前为 0。
#   - 多版本并存先 warn（Windows/wgpu 生态常见），不把"重复"误判成"不安全"。

[graph]
# 检查所有 feature 组合下的依赖（license/source 账更完整）。
all-features = true
# 不按平台裁剪：发布物有 Windows 桌面与 wasm32 两个目标，两边都要算。
targets = []

[advisories]
version = 2
# 发现 yanked 版本即判红（能否升级另行处理，不允许静默）。
yanked = "deny"
# 未维护警告只针对 workspace 直接依赖，避免把整棵树的历史包都变成红。
unmaintained = "workspace"
# 例外格式：{ id = "RUSTSEC-0000-0000", reason = "...（含复核截止日期）" }
# cargo-deny 0.20 的 ignore 只接受 id / reason 两个键，不接受单独的 expiry 字段。
# RUSTSEC-2026-0192：ttf-parser 作者声明不再维护，但没有"已修复版本"可升级。
# 它是 rustlua-render 的直接字体解析依赖，替换/自维护 fork 是独立工作项（docs/69 §4.2）。
# 过期后本门会重新变红，迫使重新评估。
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 无维护版本；替换评估见 docs/69 §4.2，复核截止 2027-10-20" },
]

[licenses]
version = 2
# 允许的 SPDX id。每一项都能在本仓依赖图里指到实际包（见 docs/69 §5 的清单）。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
]
# 低置信度许可证识别直接判红（例如只靠 LICENSE 文本猜出来的）。
confidence-threshold = 0.8
# workspace 内部 crate 不参与许可证判定（它们继承 workspace.package.license）。
private = { ignore = true }
exceptions = []

[bans]
# 多版本并存只告警：thiserror 1/2、windows-sys 0.52/0.59/0.61 等是上游生态事实，
# 不是本仓能单独消除的；真正要拦的是"同一依赖被随意引入两份"的回归，
# 由 cargo tree 审计与 review 负责，不在本门制造无法处置的红。
multiple-versions = "warn"
# `*` 版本约束只告警：workspace 内部的 path 依赖本来就不写版本（`path = "../x"`），
# 而 cargo-deny 0.20 对"公开 crate"的 path 依赖仍按 wildcard 报错——本仓没有逐个
# 标 publish=false。registry 依赖上的 `*` 由 check-security.ps1 的独立扫描判红，
# 不靠这一项（见 docs/69 §4.1）。
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# 只允许 crates.io 官方 registry 与 path 依赖；出现 git/未知 registry 即判红。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
