name: Rust quality gate

on:
  push:
    paths:
      - "engine/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "tasks/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "engine/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "tasks/**"
      - ".github/workflows/quality.yml"

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Diff check
        working-directory: ${{ github.workspace }}
        run: git diff --check

      - name: Metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Release 构建放在测试**之前**：`publish_spawn_end_to_end` 用 `-SkipBuild` 复用
      # `target/release/game.exe` 做真实的发布目录自检，若该产物不存在或是陈旧的，这条
      # 用例会以"发布应成功"失败——那是环境问题冒充代码问题（本轮就踩到过：9/14 的旧
      # runner 不含 `player_data_roots`，测试红而代码无辜）。
      - name: Release build
        run: cargo build --workspace --release

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Debug build
        run: cargo build --workspace

      - name: Game project check
        working-directory: ${{ github.workspace }}
        run: cargo run --quiet --manifest-path engine/Cargo.toml -p game -- --project "${{ github.workspace }}\examples\game_jhyt" --check

      - name: Editor project check
        working-directory: ${{ github.workspace }}
        run: cargo run --quiet --manifest-path engine/Cargo.toml -p editor -- --project "${{ github.workspace }}\examples\game_jhyt" --check

      - name: Game headless regression suite
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -File scripts/verify.ps1 -MvpOnly

      # docs/54 §7/§8-⑩：性能红线的判定逻辑必须有测试（超阈必须非零退出）。
      - name: Baseline comparison thresholds
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -File scripts/test-compare-baseline.ps1

      # docs/34「Release Candidate」清单里的 `release_atomic_ok cases=4` 此前只靠人记得跑，
      # 而 `release-atomic.ps1` 是 `package.ps1` 每次发布都走的 staging/交换/回滚核心——它回归了
      # 不会有人立刻发现。这条用例零依赖（不需要 cargo / node / GPU，只用临时目录），进门成本极低。
      - name: Atomic release swap and rollback
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -File scripts/test-release-atomic.ps1

      # docs/54 §8-⑨/⑩：WP0 基准与语义 golden（2D / 3D / **混合 2D/3D**）必须进门，而不是
      # "只在本机手动跑过"。这一步需要可用的 wgpu 适配器（示例显式请求 fallback adapter，
      # Windows 上是 WARP）；适配器缺失会让示例**报错退出**而不是静默跳过——宁可判红，也不要
      # 一份"跑过了但其实没测"的绿灯。
      - name: WP0 benchmarks and semantic goldens
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -File scripts/verify.ps1 -Benchmarks

      # docs/54 §8-⑨：Web 平台的可重复证据（浏览器契约层 + 已发布产物的启动层）。runner 上没有
      # 浏览器/已发布产物时这两层会**显式**打印跳过原因并以 2/3 退出（不是伪造通过）；真失败
      # （页面能跑却没画面、引导失败）仍是退出码 1，会让这一步判红。
      - name: Web platform evidence
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -File scripts/verify.ps1 -Web
