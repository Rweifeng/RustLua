name: Rust quality gate

on:
  push:
    paths:
      - "engine/**"
      - "game_jianghu_youtian/**"
      - "scripts/**"
      - "docs/**"
      - "tasks/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "engine/**"
      - "game_jianghu_youtian/**"
      - "scripts/**"
      - "docs/**"
      - "tasks/**"
      - ".github/workflows/quality.yml"

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Diff check
        working-directory: ${{ github.workspace }}
        run: git diff --check

      - name: Metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Debug build
        run: cargo build --workspace

      - name: Release build
        run: cargo build --workspace --release

      - name: Game project check
        working-directory: ${{ github.workspace }}
        run: cargo run --quiet --manifest-path engine/Cargo.toml -p game -- --project "${{ github.workspace }}\\game_jianghu_youtian" --check

      - name: Editor project check
        working-directory: ${{ github.workspace }}
        run: cargo run --quiet --manifest-path engine/Cargo.toml -p editor -- --project "${{ github.workspace }}\\game_jianghu_youtian" --check
