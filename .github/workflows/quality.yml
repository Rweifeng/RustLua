name: Rust quality gate

# docs/60 §7.2：原 19 步全串行在单个 job 里（任何一步失败都要等前面所有编译跑完
# 才看得到）。现在拆成 lint / security / build-test / release-closure / gates /
# web-evidence / coverage 七个互不依赖的 job（无 needs，见下方 jobs: 前注释）；
# web 证据 job 补装 zig，让 wasm 门在 CI 上真正执行而不是常态性以 3 跳过。
# 所有门一个不少，只改调度。

# 同一个 ref 上的质量门**串行**执行。2026-11-03 实测教训：连着推 5 个 commit 各自触发一套
# 40–150 分钟的作业，5 份冷缓存的 wasm release 构建并行抢 runner，最老那个卡到 138 分钟。
# 现在同一 group 里只跑一个：第一份跑完会把 rust-cache 存下来，后面的都是热缓存。
# 语义要写清楚（别误读）：GitHub 对同一 group 只保留**一个在跑 + 一个在排队**，继续推会
# 顶掉排队中的那个——所以"最新那个 push 一定有完整读数，中间的可被取代"，而不是"每个 push
# 都各跑一遍"。故意不用 cancel-in-progress: true：那会把在**跑**的那份也杀掉，读数更少。
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      # 仓库根的 README 也进集合：它的"45 个模块表 / 344 个 Lua 函数"、"`-Platform`"这些断言
      # 由 doc-claims 门核对，而 README-only 的提交原先**不触发任何 CI**——2026-11-03 实测：
      # 纯 README 提交连 run 都没建，等于那条断言在没人看的时候可以随便错。
      - "README.md"
      - "engine/**"
      - "examples/**"
      - "scripts/**"
      - "plugins/**"
      - "docs/**"
      - "tasks/**"
      - "metrics/**"
      - ".github/workflows/quality.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "README.md"
      - "engine/**"
      - "examples/**"
      - "scripts/**"
      - "plugins/**"
      - "docs/**"
      - "tasks/**"
      - "metrics/**"
      - ".github/workflows/quality.yml"
      - ".github/workflows/release.yml"

env:
  # 同一批 CI 崩溃在 coverage 插桩下仍出现；测试线程默认 2MB 栈，给足余量排除栈边界。
  RUST_MIN_STACK: "67108864"

# 各 job 之间没有 needs 依赖：lint 只负责"最快给出失败信号"，它的红不该把其余 job 变成
# skipped（skipped 既不是红也不是绿，等于这一批门没跑却看起来没出事）。每个 job 自己装
# 工具链、自己构建，因此任何一个失败都能给出本域的独立结论。
jobs:
  # 快速失败门：格式 / clippy / diff 检查都不需要产物构建，先红先停。
  lint:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Diff check
        working-directory: ${{ github.workspace }}
        run: git diff --check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # 优化项 10：rustdoc 零告警门。断链在文档站点上就是点不开的按钮，而增量只看代码
      # 是发现不了的（fmt/clippy/test 全绿时文档可以同时烂掉）。`-D warnings` 让
      # "新增一条失效 intra-doc 链接"当场判红；存量已在本批清零。
      - name: Rustdoc (warnings are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --lib

      # 优化项 10：Lua API 文档桩的再生成一致性门（本地/CI 同一条命令，见 verify.ps1
      # 的「Lua API doc stubs」步）。事实源是运行期 API 面基线，所以这一步真正回答的是
      # 「文档桩清单 == 脚本能调到的函数」+「待补桩数没有变多」。
      - name: Set up Node (Lua API doc gate)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lua API doc stubs
        working-directory: ${{ github.workspace }}
        run: node scripts/docgen/gen-lua-api-docs.js --check

      # 文档声明数字门：README/docs 摘要里人写的模块表/函数/组件数必须等于机器事实。
      # `gen-lua-api-docs.js --check` 只守文档桩清单，守不住摘要数字（历史上 README 的
      # 283 与快照的 309 并存过）。`--self-test` 用内存 fixture 反证它会红。
      - name: Documentation claims
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/verify/check-doc-claims.mjs
          node scripts/verify/check-doc-claims.mjs --self-test

      # 优化项 11：本地 pre-commit 门（git-hooks/pre-commit）自身也要进门。它只能靠每人记得
      # 跑一次安装脚本，装没装从 CI 看不出来；更要紧的是 hook 内的判定逻辑回归了不会有信号——
      # 比如暂存区过滤规则写错让门变成"永远跳过"，那正是"跑过了但其实没测"的最坏形态。
      # 该用例在临时 git 仓库里真的提交，只用 git + cargo fmt（零依赖、秒级），成本极低。
      - name: Local pre-commit hook regression
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -File scripts/test/test-git-hooks.ps1
      # 静默留痕门（docs/60 §10.7）：测试门守不住"只缺留痕"的缺陷，用 grep 断言固化读出来的约定。
      - name: Silent-failure traces
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -File scripts/verify/check-silent-traces.ps1

  # 供应链安全门（P2-01）：工具版本固定，缺工具/网络失败必须判红或显式 blocked。
  # 与 release.yml 的 security 步骤共用同一入口 check-security.ps1，避免"本地一套、CI 一套"。
  # 依赖先 cargo check：fork-sync 报告要读 registry/src 里的上游源码，只 fetch 不够。
  security:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Toolchain lock
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify/check-toolchain-lock.ps1
          if ($LASTEXITCODE -ne 0) { throw "toolchain lock failed (exit $LASTEXITCODE)" }

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned security tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-cyclonedx@0.5.9

      - name: Unpack dependency sources
        working-directory: engine
        run: cargo check --locked --workspace --all-features

      - name: Generate SBOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/reports | Out-Null
          node scripts/release/gen-sbom.mjs --output artifacts/reports/rustlua.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "gen-sbom failed (exit $LASTEXITCODE)" }

      - name: Generate cargo-cyclonedx cross-check (independent implementation)
        working-directory: engine
        run: cargo cyclonedx --manifest-path crates/game/Cargo.toml --format json --spec-version 1.5 --describe crate

      - name: Collect cross-check SBOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/reports | Out-Null
          Copy-Item engine/crates/game/game.cdx.json artifacts/reports/rustlua.cargo-cyclonedx-game.cdx.json -Force

      - name: Supply-chain security gate
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify/check-security.ps1 `
            -RequireTools -FetchForkUpstream `
            -SbomPath artifacts/reports/rustlua.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "security gate failed (exit $LASTEXITCODE)" }

      - name: Security gate self-tests
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify/test-security-gates.ps1
          if ($LASTEXITCODE -ne 0) { throw "security self-tests failed (exit $LASTEXITCODE)" }

      - name: Upload SBOM and security evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: |
            artifacts/reports/rustlua.cdx.json
            artifacts/reports/rustlua.cargo-cyclonedx-game.cdx.json
            artifacts/logs/security/*
          if-no-files-found: warn

  # 编译 + 全量测试（windows）。Release 构建放在测试**之前**：
  # `publish_spawn_end_to_end` 用 `-SkipBuild` 复用 `target/release/game.exe` 做真实的
  # 发布目录自检，若该产物不存在或是陈旧的，这条用例会以"发布应成功"失败——那是
  # 环境问题冒充代码问题（本轮就踩到过：9/14 的旧 runner 不含 `player_data_roots`，
  # 测试红而代码无辜）。
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Release build
        run: cargo build --workspace --release

      - name: Tests
        # 2026-10-21 CI：默认并行 test 线程下 engine --lib 偶发 0xC0000005
        # （STATUS_ACCESS_VIOLATION）；同一二进制单线程本地与覆盖率采集均通过。
        # 固定单线程换取可复现性，代价是测试墙钟时间变长。
        # 2026-10-26：RUST_TEST_THREADS 实际配的是 2（并行），e69fdc53 在
        # editor 上复现 0xC0000005；改回 1 与注释意图一致，AV 消失。
        env:
          RUST_TEST_THREADS: "1"
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\artifacts\logs\quality" | Out-Null
          $log = "${{ github.workspace }}\artifacts\logs\quality\build-test-tests.log"
          cargo test --workspace --all-features 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Host "tests failed (exit $code); full log: $log" }
          exit $code

      - name: Debug build
        run: cargo build --workspace

      - name: Upload build-test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-logs
          path: artifacts/logs/quality/*
          if-no-files-found: warn

  # 发布闭包（容器内容）：`assetc closure` 直接读 RLB 索引，断言"计划里的每条逻辑路径都在容器里"、
  # 条目数/块大小/字节数/FNV 与计划一致。此前它只在发布机上有真产物时才跑（apply-bundle-layout /
  # verify-wechat-minigame），CI 完全覆盖不到——于是"容器文件都在、但某个按需组少了一条资源"
  # 可以一路绿到真机：启动场景刚好不用它，玩到一半才白图。这条 job 用合成工程跑 7 条断言：
  # 单根正例 + 三个反例（改坏容器 / 删容器 / 塞计划外容器）+ 黄金表落地 + **平台形态**
  # （真拆根、真改名、多根闭包）与其缺件反例。零 wasm、零浏览器、零 GPU。
  release-closure:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (bundle-layout / check-bundle-mounts)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build assetc
        run: cargo build -p assetc --release

      # `-RequireAssetc`：这一步刚构建过，找不到就是配置错；静默跳过会把"门没跑"伪装成"门通过"。
      # 两个坐标都要覆盖：①assetc 原始输出（单根、未改名）；②平台形态（`assetc layout` 拆根 +
      # `.rlb` → `.rlb.txt` 改名，用真工具 `bundle-layout.js --apply` 造），后者才是"平台发布闭包"。
      # 用例里自带反例（改坏/删/多容器/多根缺件），所以 CI 同时证明"门会拦"与"门在平台目录下成立"。
      - name: Container closure regress (single-root + platform multi-root)
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -File scripts/test/test-release-closure.ps1 -Assetc engine/target/release/assetc.exe -RequireAssetc

  # 项目门 + 发布链路自测：消费 build-test 之外不需要 release 产物的检查项。
  gates:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Game project check
        run: cargo run --quiet --manifest-path engine/Cargo.toml -p game -- --project "${{ github.workspace }}\examples\game_api" --check

      - name: Editor project check
        run: cargo run --quiet --manifest-path engine/Cargo.toml -p editor -- --project "${{ github.workspace }}\examples\game_api" --check

      # 仓库里只剩一个样板工程（game_api）；《江湖有田》已迁出到 E:\Qoder\game_jhyt，
      # 它的 81 个 jhyt_* headless 回归不再属于本仓库的 CI。
      - name: Game headless regression suite
        run: pwsh -NoProfile -File scripts/verify/verify.ps1 -MvpOnly

      # docs/54 §7/§8-⑩：性能红线的判定逻辑必须有测试（超阈必须非零退出）。
      - name: Baseline comparison thresholds
        run: pwsh -NoProfile -File scripts/test/test-compare-baseline.ps1

      # docs/34「Release Candidate」清单里的 `release_atomic_ok cases=4` 此前只靠人记得跑，
      # 而 `release-atomic.ps1` 是 `package.ps1` 每次发布都走的 staging/交换/回滚核心——它回归了
      # 不会有人立刻发现。这条用例零依赖（不需要 cargo / node / GPU，只用临时目录），进门成本极低。
      - name: Atomic release swap and rollback
        run: pwsh -NoProfile -File scripts/test/test-release-atomic.ps1

      # 微信多根路由 + 计划表结构校验：纯 Node、零构建、秒级。此前只有本地手动跑过，于是
      # `bundle-roots.js` 的路由/挂载编排回归（具名分包路由错、预挂漏根）在 CI 上是静默的。
      # `check-bundle-mounts.js --self-test` 钉住另外两条"第二套假设"：容器改名只认产物自带的
      # `code-package.json`（规则模块兜底），发布根缺计划表时**不许**拿 `pack/` 的副本冒充。
      # 容器内容闭包在 `release-closure` job 里跑（单根 + 平台多根两种坐标 + 反例）。
      - name: Set up Node (WeChat routing gates)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # P4-00：trend_db.py / 度量脚本的 CI Python 版本必须与 tools.json 一致
      # （check-toolchain-lock.ps1 校验 python-version == tools.python）。
      - name: Set up Python (metrics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: WeChat bundle routing and plan structure
        run: |
          node plugins/wechat-minigame/bundle-roots.js --self-test
          node scripts/test/wechat-asset-routing-test.js
          node scripts/build/check-boot-closure.js --self-test
          node scripts/test/asset-routing-golden-test.js
          node scripts/build/check-bundle-mounts.js --self-test

      # docs/54 §8-⑨/⑩：WP0 基准与语义 golden（2D / 3D / **混合 2D/3D**）必须进门，而不是
      # "只在本机手动跑过"。这一步需要可用的 wgpu 适配器（示例显式请求 fallback adapter，
      # Windows 上是 WARP）；适配器缺失会让示例**报错退出**而不是静默跳过——宁可判红，也不要
      # 一份"跑过了但其实没测"的绿灯。
      - name: WP0 benchmarks and semantic goldens
        run: pwsh -NoProfile -File scripts/verify/verify.ps1 -Benchmarks

  # Web/wasm 证据门。docs/60 §7.2：补装 zig 后 wasm Lua 门在 CI 上**真的执行**
  # （此前 GitHub runner 无 zig，常态以 3 显式跳过）。跳过绝不等于通过的哲学不变：
  # 真失败（页面能跑却没画面、引导失败、桥断言不过）仍判红。
  web-evidence:
    # 有界：这一步要在冷缓存下做一次 wasm release 构建（fat LTO / 单 CGU）+ 三个宿主的后处理。
    # 热缓存约 20–30 分钟；给它 150 分钟余量，超时按"挂死"处理并判红，而不是让 job 吃满 6 小时上限。
    timeout-minutes: 150
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install zig (makes wasm gates execute instead of skipping)
        # 尽力而为：装不上（choco 源没有对应版本）就让 wasm 门按既有语义以 3 显式跳过，
        # 不能让 CI 比拆分前更脆。
        continue-on-error: true
        run: choco install zig -y

      # docs/54 §8-⑨：Web 平台的可重复证据（浏览器契约层 + 已发布产物的启动层）。runner 上没有
      # 浏览器/已发布产物时这两层会**显式**打印跳过原因并以 2/3 退出（不是伪造通过）；真失败
      # （页面能跑却没画面、引导失败）仍是退出码 1，会让这一步判红。
      - name: Web platform evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\artifacts\logs\quality" | Out-Null
          $log = "${{ github.workspace }}\artifacts\logs\quality\web-evidence.log"
          pwsh -NoProfile -File scripts/verify/verify.ps1 -Web 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          # 判红之前先把"为什么红"摊在 job 日志里：这份日志此前只落工作区（失败时虽作为
          # artifact 上传，但要下载才看得到），job 日志里只留一个退出码——2026-11-02 排查
          # CI 时踩到，三次红都无从判断是哪一层。
          if ($code -ne 0) {
            Write-Host "::group::web evidence failure tail (last 40 lines of $log)"
            Get-Content -LiteralPath $log -Tail 40 | ForEach-Object { Write-Host $_ }
            Write-Host "::endgroup::"
            # 再挑几条"像原因"的行发成 **annotation**：`::error::` 会挂到 check run 的
            # annotations 上，那是**不下载 artifact、不用认证**也能读到的位置（job 日志要
            # auth，artifact 要下载）。排查 CI 的人第一眼就能看到判红的那一句，而不是一个
            # 光秃秃的 exit 1。长度截断到 300 字符，避免把整段日志塞进 annotation。
            # 末尾 10 行**原样**发一份：PowerShell 的错误在日志里是"命令 + CategoryInfo +
            # FullyQualifiedErrorId"多行组成，只挑"含 error 的行"会把命令名那行筛掉
            # （2026-11-03 就是这样只看到 CommandNotFoundException 而不知道是哪个命令）。
            $tail = @(Get-Content -LiteralPath $log -Tail 10)
            $picked = @(Get-Content -LiteralPath $log -Tail 120 |
                Where-Object { $_ -match 'FAIL|failed|error|Error|throw|Exception|CommandNotFound|not recognized|无法将|失败|异常|String\) \[\]' } |
                Select-Object -Last 8)
            $hints = @($picked + $tail | Where-Object { $_ -and $_.Trim() } | Select-Object -Unique | Select-Object -Last 12)
            if ($hints.Count -eq 0) { $hints = @(Get-Content -LiteralPath $log -Tail 3) }
            # `CommandNotFoundException` 的真正答案在 `(命令名:String) []` 里，单独挖出来。
            $notFound = @(Get-Content -LiteralPath $log -Tail 200 |
                Where-Object { $_ -match '\(([^()]+):String\)' } |
                ForEach-Object { $Matches[1] } |
                Select-Object -Unique)
            foreach ($cmdName in $notFound) {
              Write-Host "::error::web evidence: missing command => $cmdName"
            }
            foreach ($hint in $hints) {
              $clean = ($hint -replace '[\r\n]+', ' ').Trim()
              if ($clean.Length -gt 300) { $clean = $clean.Substring(0, 300) + '...' }
              if ($clean) { Write-Host "::error::web evidence: $clean" }
            }
            Write-Host "web evidence failed (exit $code); full log: $log"
            exit $code
          }

      # wasm Lua 运行期验证门：no-modules 桥（game_web 的 Lua 桥导出）+ gpu2d 宿主画布探针的
      # Node 验证。**直接**调 wrapper（不经 verify.ps1），避免把整套常规门再跑
      # 一遍；退出码 0=通过 / 1=判红 / 3=环境受限跳过。装了 zig 后本地/CI 行为一致：真的构建
      # wasm 并跑完 bridge+probe。
      - name: wasm Lua runtime evidence
        shell: pwsh
        run: |
          $status = "artifacts/logs/wasm-lua/ci.status"
          New-Item -ItemType Directory -Force -Path (Split-Path $status) | Out-Null
          $env:ZIG = "zig"
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify/verify-wasm-lua.ps1 -StatusFile $status
          $code = 1
          if (Test-Path -LiteralPath $status) {
            $raw = ((Get-Content -LiteralPath $status -Raw).Trim()) -replace '^exit=', ''
            $parsed = 0
            if ([int]::TryParse($raw, [ref]$parsed)) { $code = $parsed }
          } else {
            Write-Host "wasm-lua wrote no status file (treated as failure)"
          }
          if ($code -eq 1) { throw "wasm-lua verification FAILED (verify-wasm-lua.ps1 exit 1)" }
          if ($code -eq 3) { Write-Host "wasm_lua_skipped reason=environment_limited exit=3 (runner lacks zig/wasm32 target/node)" }
          else { Write-Host "wasm_lua_ok exit=0 (no-modules bridge + gpu2d host probe passed)" }

      # webgl 新 EH（try_table/exnref）跨浏览器覆盖门：把真实产物的 game_web_bg.wasm 送进本机每个
      # 浏览器编译一遍，证明它所用的新异常处理被支持（门槛 Chrome/Edge 137、Firefox 131、Safari/iOS
      # 18.4；低于门槛连编译都过不去）。只编译不跑游戏，与启动层正交。**直接**调 runner；退出码
      # 0=已发现浏览器全 PASS / 1=有 FAIL / 3=环境受限（无浏览器或无已发布 webgl 产物）跳过。
      # Safari 无法在 Windows 自动化，runner 会打印 Mac 上的手动验证流程。跳过绝不等于通过。
      - name: webgl new-EH cross-browser evidence
        shell: pwsh
        run: |
          $status = "artifacts/logs/webgl/ci-eh.status"
          New-Item -ItemType Directory -Force -Path (Split-Path $status) | Out-Null
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify/verify-webgl-eh.ps1 -StatusFile $status
          $code = 1
          if (Test-Path -LiteralPath $status) {
            $raw = ((Get-Content -LiteralPath $status -Raw).Trim()) -replace '^exit=', ''
            $parsed = 0
            if ([int]::TryParse($raw, [ref]$parsed)) { $code = $parsed }
          } else {
            Write-Host "webgl-eh wrote no status file (treated as failure)"
          }
          if ($code -eq 1) { throw "webgl new-EH cross-browser check FAILED (verify-webgl-eh.ps1 exit 1)" }
          if ($code -eq 3) { Write-Host "webgl_eh_skipped reason=environment_limited exit=3 (no browser or no published webgl bundle)" }
          else { Write-Host "webgl_eh_ok exit=0 (new-EH wasm compiles in all discovered browsers)" }

      - name: Upload web-evidence logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-evidence-logs
          path: artifacts/logs/quality/*
          if-no-files-found: warn

  # P4-01 覆盖率棘轮：llvm-cov 全 workspace 采集 → 归一化 → 与基线比（总 −0.5pp /
  # 单 crate −2.0pp 判红）。只覆盖"本次改动真正碰到的树"这一层判断由 workflow 级
  # paths 承担（engine/** + metrics/**）；基线未就位时退 3（BLOCKED），绝不冒充通过。
  # 上传 coverage.json / lcov.info / html 作离线复核证据。
  coverage:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1 with llvm-tools-preview
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # P4-00：度量脚本的 CI Python 版本必须与 tools.json 一致
      # （check-toolchain-lock.ps1 校验 python-version == tools.python）。
      - name: Set up Python (metrics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Toolchain lock (metrics tools)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify/check-toolchain-lock.ps1
          if ($LASTEXITCODE -ne 0) { throw "toolchain lock failed (exit $LASTEXITCODE)" }

      # check-coverage.ps1 在 engine/ 采集（workspace 根在 engine/），然后归一化、
      # 判棘轮；--no-fail-fast 下测试失败按 exit 1 判红，覆盖率数字不掩盖红测试。
      - name: Coverage ratchet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\artifacts\logs\quality" | Out-Null
          $log = "${{ github.workspace }}\artifacts\logs\quality\coverage-ratchet.log"
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify/check-coverage.ps1 -RequireTool 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -eq 3) { Write-Host "coverage_blocked reason=no_baseline (baseline not committed yet; first run must be reviewed and --update locally)" }
          if ($code -ne 0) { Write-Host "coverage gate failed (exit $code); full log: $log"; throw "coverage gate failed (exit $code)" }

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: |
            artifacts/metrics/coverage.json
            artifacts/metrics/coverage-summary.json
            artifacts/metrics/coverage-summary.md
            artifacts/metrics/lcov.info
            artifacts/metrics/html/
          if-no-files-found: warn

      - name: Upload coverage logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-logs
          path: artifacts/logs/quality/*
          if-no-files-found: warn
