<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>RustLua GPU 后端探针</title>
</head>
<!--
  WP2 的"GPU 后端技术验证"页面：把 `gpu-web-probe` 这个 wasm 探针跑起来，把结果**写进
  body 的 data-* 属性**，由 `scripts/gpu-web-probe.ps1` 用既有的 CDP 轮询（webgl-cdp-wait.js）
  读回来。

  为什么不是"在游戏页面里顺手探一下"：探针会把 wgpu 的 GL 后端真的链进产物（几 MB）。
  它必须是**独立 crate**，发布包体积一分都不能因此变大——微信主包已经卡在体积上了。

  为什么状态与结果分两个属性：状态是轮询的判据（`pending`→`done`/`failed`），结果是一段 JSON。
  CDP dump 出来的是**序列化后的 DOM**，属性值里的 `"` 会变成 `&quot;`，
  所以取回 JSON 时要做一次反转义（在 `.ps1` 里做，见 `ConvertFrom-HtmlAttr`）。
-->
<body data-gpu-probe="pending">
  <h1>GPU 后端探针</h1>
  <pre id="out">probe running…</pre>
  <script type="module">
    import init, { gpu_probe } from './pkg/gpu_web_probe.js';

    const out = document.getElementById('out');
    function report(state, text) {
      document.body.setAttribute('data-gpu-probe', state);
      document.body.setAttribute('data-gpu-probe-json', text);
      out.textContent = text;
    }

    try {
      await init();
      // `gpu_probe()` 自己会把内部错误写进 JSON（不让 Promise reject），
      // 这里只兜"模块加载不起来"这类失败。
      const json = await gpu_probe();
      window.__GPU_PROBE_JSON = json;
      report('done', json);
    } catch (error) {
      report('failed', String((error && error.stack) || error));
    }
  </script>
</body>
</html>
