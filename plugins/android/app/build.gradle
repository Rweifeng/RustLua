plugins {
    id "com.android.application"
}

def rustluaApplicationId = project.findProperty("applicationId") ?: "com.rustlua.game"

android {
    namespace rustluaApplicationId
    compileSdk 35

    defaultConfig {
        applicationId rustluaApplicationId
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
