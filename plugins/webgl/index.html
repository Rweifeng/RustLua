<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__PUBLISH_NAME__</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #151923; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #status { position: fixed; left: 16px; top: 12px; color: #d0d7e2; font: 14px sans-serif; }
  </style>
</head>
<body data-rustlua-boot="pending">
  <canvas id="rustlua-canvas"></canvas>
  <div id="status">Loading __PUBLISH_NAME__...</div>
  <script>window.__RUSTLUA_FONT = '__FONT_PATH__';</script>
  <script>
    // 后备缓冲（canvas.width/height）必须跟随**布局尺寸 × dpr**。
    // wasm 入口 start() 只把它钉成一次 1280×720，而 CSS 是 100vw×100vh：两者一旦不等，
    // 浏览器就对画布做非等比拉伸（实测 530×557 窗口：横 0.414、纵 0.774，圆变椭圆、
    // 文字发糊），并且 web-runtime 的 contain 适配退化成 fitS=1 的空操作（那条路径本来
    // 就是为"画布 ≠ 设计比例"准备的）。微信小游戏侧由 wechat-adapter 设成物理像素，
    // 这里补浏览器侧的同一件事。
    window.__rustluaSyncCanvasSize = function () {
      var canvas = document.getElementById('rustlua-canvas');
      if (!canvas) return;
      // 布局盒为 0（后台标签页 / 尚未布局 / 视口 0×0）时必须直接跳过：写 0 会被下面的
      // Math.max(1,…) 兜成 1×1，整张画布就此塌掉（实测：浏览器面板切后台后画面全空）。
      var cw = canvas.clientWidth, ch = canvas.clientHeight;
      if (!(cw > 0) || !(ch > 0)) return;
      var dpr = window.devicePixelRatio || 1;
      var w = Math.max(1, Math.round(cw * dpr));
      var h = Math.max(1, Math.round(ch * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    };
    window.__rustluaSyncCanvasSize();
    window.addEventListener('resize', window.__rustluaSyncCanvasSize);
    // 调试开关（两者都可在控制台即时改，标志每帧读一次）：
    //   ?rustlua-debug=1     左上加载行 + 底部 "Project/Scene/Lua update running"
    //   ?rustlua-colliders=1 碰撞描边：实心格 / 地图边界 / Collider / Sprite 占位
    (function () {
      var params = new URLSearchParams(location.search);
      var enabled = function (name) {
        var value = params.get(name);
        return value !== null && value !== '0' && value !== 'false';
      };
      window.__RUSTLUA_DEBUG = enabled('rustlua-debug');
      window.__RUSTLUA_DEBUG_COLLIDERS = enabled('rustlua-colliders');
    })();
  </script>
  <script src="./web-runtime.js"></script>
  <script type="module">
    import init, { start, lua_boot, lua_do_string, lua_set_number, lua_input_frame, input_frame_layout_json, lua_call_global, lua_call_global_void, lua_register_js_callback, lua_missing_globals, lua_execute_main, lua_api_surface_json, host_api_module_names_json } from './pkg/game_web.js';
    const publishName = __PUBLISH_NAME_JSON__;
    const status = document.getElementById('status');
    const markBoot = (state, detail) => {
      document.body.setAttribute('data-rustlua-boot', state);
      if (detail) document.body.setAttribute('data-rustlua-boot-detail', String(detail).slice(0, 400));
    };

    // ---- 新 EH 覆盖门槛守卫 ----
    // 本产物是纯 try_table（wasm “新异常处理”，由 vendored Lua 的 longjmp 经 -fwasm-exceptions
    // 降低而来）。低于门槛的引擎**连模块都编译不过**，且 WP10 迁移后已无 fengari 回退。与其让它
    // 下载 ~3MB wasm 再抛一个晦涩的 CompileError，不如**下载前**就给可操作的提示。
    // 门槛（MDN browser-compat-data，2026-09 核对）：Chrome/Edge 137、Firefox 131、Safari/iOS 18.4。
    const EH_FLOOR = { chrome: 137, edge: 137, firefox: 131, safari: 18.4 };
    const detectEngine = () => {
      const ua = navigator.userAgent;
      let m;
      // 顺序要紧：Edge 的 UA 里也含 "Chrome/"；iOS 上所有浏览器都用 WebKit(JSC)，其 EH 能力
      // 取决于系统版本而非 App 版本，故这里只对能**确信**识别的桌面引擎做拦截，其余交给运行期兜底。
      if ((m = ua.match(/Edg(?:e|A)?\/(\d+)/))) return { engine: 'edge', version: m[1] };
      if ((m = ua.match(/Firefox\/(\d+)/))) return { engine: 'firefox', version: m[1] };
      if ((m = ua.match(/Chrome\/(\d+)/))) return { engine: 'chrome', version: m[1] };
      if (/Safari\//.test(ua) && (m = ua.match(/Version\/(\d+)(?:\.(\d+))?/))) {
        return { engine: 'safari', version: m[1] + (m[2] ? '.' + m[2] : '') };
      }
      return { engine: 'unknown', version: '0' };
    };
    const versionAtLeast = (v, floor) => {
      const a = String(v).split('.').map((x) => parseInt(x, 10) || 0);
      const b = String(floor).split('.').map((x) => parseInt(x, 10) || 0);
      for (let i = 0; i < Math.max(a.length, b.length); i++) {
        const ai = a[i] || 0, bi = b[i] || 0;
        if (ai > bi) return true;
        if (ai < bi) return false;
      }
      return true;
    };
    // 仅在**确信**低于门槛时返回原因；未知引擎返回 null（不误拦，交运行期 catch 兜底）。
    const unsupportedReason = () => {
      if (typeof WebAssembly === 'undefined') return 'no-webassembly';
      const d = detectEngine();
      const floor = EH_FLOOR[d.engine];
      if (floor && !versionAtLeast(d.version, floor)) return d.engine + ' ' + d.version + ' < required ' + floor;
      return null;
    };
    const showUnsupported = (reason) => {
      status.innerHTML =
        '您的浏览器版本过低，无法运行本游戏。<br>' +
        '请更新后重试：iOS Safari 18.4+ / Chrome 或 Edge 137+ / Firefox 131+。' +
        (reason ? '<br><span style="opacity:.6;font-size:12px">(' + reason + ')</span>' : '');
      markBoot('unsupported-browser', reason || 'below new-EH floor');
    };

    const reason = unsupportedReason();
    if (reason) {
      showUnsupported(reason);
    } else {
      try {
        await init();
        await start('rustlua-canvas', publishName);
        // start() 里会把后备缓冲设成设计尺寸 1280×720，必须在它之后再接管尺寸。
        window.__rustluaSyncCanvasSize();
        // WP10 迁移（fengari → mlua-wasm）：wasm Lua 桥挂到全局，web-runtime.js 的
        // Lua 交互（建运行时/注入补丁/调全局/注册 JS 回调/查缺失全局）全部经它完成。
        // fengari-web.js 已从发布包移除。
        // `lua_set_number`：逐帧写 `__rustlua_dt` 用（不编译 chunk）。**这份门面是显式白名单**，
        // 与 plugins/wechat-minigame/wechat-adapter.js 里的那份必须同步：Rust 侧加了 wasm 导出
        // 却漏了这里，运行时就拿到 undefined，表现为"启动即失败"。
        // `lua_input_frame` / `input_frame_layout_json`：每帧输入批量线格式（`RLFI`）用，
        // 取代"每帧拼一段 Lua 源码再编译"。
        // `lua_call_global_void`：**无参无返回**的全局钩子（每步的虚拟键/边沿清理）用，
        // 取代 `doString("__rustlua_apply_virtual_input()")` 那种"为调一个无参函数而编译源码"。
        window.__RUSTLUA_LUA_BRIDGE = {
          lua_boot, lua_do_string, lua_set_number, lua_call_global, lua_call_global_void,
          lua_input_frame, input_frame_layout_json,
          lua_register_js_callback, lua_missing_globals, lua_execute_main,
          lua_api_surface_json, host_api_module_names_json
        };
        await window.rustluaRunLuaGame(status);
        // 启动成功后收起这行加载文案：留着就是盖在游戏画面左上的一条调试字。
        // 失败分支不动（那时它是玩家唯一能看到的报错出口）。
        if (window.__RUSTLUA_DEBUG) status.textContent = publishName + ' - Lua running (mlua-wasm)';
        else status.hidden = true;
        markBoot('ok', publishName);
      } catch (error) {
        console.error(error);
        // 运行期兜底：未知引擎或卡在门槛边缘时，编译仍可能因缺新 EH 失败——把这类失败也归到
        // “浏览器不支持”，给出可操作提示，而不是把裸 CompileError 甩给用户。
        const msg = String((error && error.message) || error);
        if (/try_table|exnref|exception handling|legacy and new|unexpected opcode|unreachable opcode|invalid opcode/i.test(msg)) {
          showUnsupported(msg.slice(0, 200));
        } else {
          status.textContent = 'WebGL startup failed: ' + error;
          markBoot('failed', msg);
        }
      }
    }
  </script>

</body>
</html>
