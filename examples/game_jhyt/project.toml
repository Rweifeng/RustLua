# 键盘 + 手柄双绑定（move_* = WASD / attack=j / interact=e / inventory=i /
# pause=p / respawn=r / skill=k，与引擎默认键位及玩家设置一致）。
# 2026-10-11 修：此前这份文件只剩手柄绑定（M20-08 手柄验收留下的形态，
# 文件头当时写着"示例结束时按原样恢复"），于是 PC 与编辑器 Play 里
# WASD 完全无响应——网页/微信能用只是因为那边走 `ui/virtual_pad.lua` 的
# `input.virtual_key` 注入，它绕过绑定表。
[project]
name = "game_jhyt"
version = "0.1.0"
engine = "RustLua"
main_script = "scripts/main.lua"
startup_scene = "scenes/main.scene"
font = "assets/fonts/NotoSansSC-VF.ttf"
font_fallback = ""
font_weight = 400.0
text_render_mode = "vector"
window_width = 1280
window_height = 720
wechat_appid = "wx7091f1cf872130bb"

[audio]
master = 0.5
bgm = 0.25

[input]
map = "rustlua-actions-v2\nattack=key:keyj,pad:2\nbuild=key:keyb\ncancel=key:escape,pad:1\nconfirm=key:space,pad:0\ndemolish=key:keyx\ngift=key:keyg\ninteract=key:keye,pad:0\ninventory=key:keyi,pad:4\nmove_down=key:keys,padaxis:1-\nmove_left=key:keya,padaxis:0-\nmove_right=key:keyd,padaxis:0+\nmove_up=key:keyw,padaxis:1+\npause=key:keyp,pad:5\nplace=key:keyf\npractice=key:keyq\nquest=key:keyl\nrespawn=key:keyr,pad:8\nseed=key:keyc\nskill=key:keyk,pad:3\nsleep=key:keyt\nslot_1=key:digit1\nslot_2=key:digit2\nslot_3=key:digit3\nslot_4=key:digit4\nslot_5=key:digit5\nslot_6=key:digit6\nslot_7=key:digit7\nslot_8=key:digit8\nslot_9=key:digit9\nui_down=key:arrowdown,pad:13\nui_left=key:arrowleft,pad:14\nui_right=key:arrowright,pad:15\nui_up=key:arrowup,pad:12\nuse=key:keyu\nvolume_down=key:minus\nvolume_up=key:equal"
