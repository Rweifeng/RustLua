# M20-08 手柄验收设置（示例结束时按原样恢复）
[project]
name = "game_jhyt"
version = "0.1.0"
engine = "RustLua"
main_script = "scripts/main.lua"
startup_scene = "scenes/main.scene"
font = "assets/fonts/NotoSansSC-VF.ttf"
font_fallback = ""
font_weight = 400.0
text_render_mode = "vector"
window_width = 1280
window_height = 720

[audio]
master = 0.5
bgm = 0.25

[input]
map = "rustlua-actions-v2\nattack=pad:2\nbuild=key:keyb\ncancel=key:escape,pad:1\nconfirm=key:space,pad:0\ndemolish=key:keyx\ngift=key:keyg\ninteract=pad:0\ninventory=pad:4\nmove_down=padaxis:1-\nmove_left=padaxis:0-\nmove_right=padaxis:0+\nmove_up=padaxis:1+\npause=pad:5\nplace=key:keyf\npractice=key:keyq\nquest=key:keyl\nrespawn=pad:8\nseed=key:keyc\nskill=pad:3\nsleep=key:keyt\nslot_1=key:digit1\nslot_2=key:digit2\nslot_3=key:digit3\nslot_4=key:digit4\nslot_5=key:digit5\nslot_6=key:digit6\nslot_7=key:digit7\nslot_8=key:digit8\nslot_9=key:digit9\nui_down=key:arrowdown,pad:13\nui_left=key:arrowleft,pad:14\nui_right=key:arrowright,pad:15\nui_up=key:arrowup,pad:12\nuse=key:keyu\nvolume_down=key:minus\nvolume_up=key:equal"
